apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-reports
spec:
  replicas: 3
  selector:
    matchLabels: { app: internal-reports }
  template:
    metadata:
      labels: { app: internal-reports }
    spec:
      containers:
        - name: app
          image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/internal-reports:1.0.0
          command: ["node", "index.js"]
          ports:
            - containerPort: 3000
