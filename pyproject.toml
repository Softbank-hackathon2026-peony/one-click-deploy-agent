[project]
name = "infrafit"
version = "0.1.0"
description = "앱 저장소를 읽고 필요한 만큼의 인프라를 판정하는 진단 엔진"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "python-hcl2>=4.3",
]

[project.scripts]
infrafit = "infrafit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infrafit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
