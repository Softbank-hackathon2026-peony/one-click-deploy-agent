# 적합성 규칙(계획 2 MVP, 고정 형식). 차원 값(profile.json) × 능력 값(knowledge/capabilities.yaml).
#
# when:    {dimension: <A1~G3>, <연산자>}           연산자: equals | in | exists
#          exists: true = 값이 있고 null·false·빈 목록·"없음"이 아님 (dimensions.md의 "없음 / 있음(종류 목록)" 차원용)
# require: {capability: <능력 키>, <연산자>}         연산자: equals | gte | exists, 또는 {any: [...]} | {all: [...]}
#          능력 키가 capabilities.yaml에 없으면(생략) 결과는 unknown.
# otherwise: infeasible | config
#          config 이면 config_from 능력 키의 값(설정 이름)이 있을 때 feasible_with_config, 없으면 infeasible.
# config_from: otherwise=config 일 때 설정 이름을 가져올 능력 키(아니면 null)
#
# 인스턴스 1개 고정 규칙(B1, B3)은 "그대로는 통과하지 않고 설정으로만 통과한다"를
# require {capability: CP.single_instance_config, exists: false}로 적는다:
# 키가 없으면 unknown, 설정 이름이 있으면 require 실패 → otherwise config → feasible_with_config.

rules:
  - id: CAP-ALWAYSON-001
    when: {dimension: A1, in: [worker, scheduled]}
    require:
      any:
        - {capability: CP.always_on, equals: true}
        - {capability: CP.cpu_after_response, equals: true}
    otherwise: infeasible
    config_from: null
    message: "상시 실행되는 워커·정기 작업이 있는데 이 플랫폼은 요청 밖에서 프로세스를 계속 실행하지 않는다"

  - id: CAP-TIMEOUT-001
    when: {dimension: A2, equals: "수십 초"}
    require: {capability: CP.max_request_seconds, gte: 60}
    otherwise: infeasible
    config_from: null
    message: "요청 처리에 수십 초가 걸리는데 이 플랫폼의 요청 시간 상한이 60초보다 짧다"

  - id: CAP-WEBSOCKET-001
    when: {dimension: A3, equals: websocket}
    require: {capability: CP.websocket, equals: true}
    otherwise: infeasible
    config_from: null
    message: "장시간 웹소켓 연결이 필요한데 이 플랫폼은 지원하지 않는다"

  - id: CAP-BGWORK-001
    when: {dimension: A4, exists: true}
    require: {capability: CP.cpu_after_response, equals: true}
    otherwise: config
    config_from: CP.cpu_after_response_config
    message: "응답 후 작업이 있는데 이 플랫폼은 응답을 보낸 뒤 CPU를 주지 않는다"

  - id: CAP-MEMSTATE-001
    when: {dimension: B1, exists: true}
    require: {capability: CP.single_instance_config, exists: false}
    otherwise: config
    config_from: CP.single_instance_config
    message: "프로세스 메모리에 상태가 있어 인스턴스를 1개로 고정해야 한다"

  - id: CAP-LOCALDISK-001
    when: {dimension: B2, exists: true}
    require: {capability: CP.persistent_local_disk, equals: true}
    otherwise: infeasible
    config_from: null
    message: "로컬 디스크에 상태(SQLite·업로드 파일)가 있는데 이 플랫폼의 로컬 디스크는 영속하지 않는다"

  - id: CAP-SINGLERUN-001
    when: {dimension: B3, exists: true}
    require: {capability: CP.single_instance_config, exists: false}
    otherwise: config
    config_from: CP.single_instance_config
    message: "앱 안 스케줄러처럼 한 번만 실행돼야 하는 작업이 있어 인스턴스를 1개로 고정해야 한다"
